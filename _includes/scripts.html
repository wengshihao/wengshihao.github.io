<script src="assets/js/main.min.js"></script>

<script>
  (function () {
    function openExternalInNewTab() {
      var here = window.location.host;
      var anchors = document.querySelectorAll('a[href]');
      Array.prototype.forEach.call(anchors, function (a) {
        var href = a.getAttribute('href') || '';
        if (!/^https?:\/\//i.test(href)) return;          // skip #anchor, /relative, mailto:, etc.
        try {
          var u = new URL(href);
          if (u.host && u.host !== here) {
            a.target = '_blank';
            var rel = (a.getAttribute('rel') || '').split(/\s+/).filter(Boolean);
            if (rel.indexOf('noopener') === -1) rel.push('noopener');
            if (rel.indexOf('noreferrer') === -1) rel.push('noreferrer');
            a.setAttribute('rel', rel.join(' '));
          }
        } catch (e) {}
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', openExternalInNewTab);
    } else {
      openExternalInNewTab();
    }
  })();
</script>

{% if site.goatcounter_code %}
<script data-goatcounter="https://{{ site.goatcounter_code }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<script>
  (function () {
    var card = document.querySelector('[data-goatcounter-total]');
    var count = card && card.querySelector('[data-goatcounter-count]');
    if (!card || !count) return;

    fetch(card.getAttribute('data-goatcounter-total'))
      .then(function (response) {
        if (!response.ok) throw new Error('Visitor count unavailable');
        return response.json();
      })
      .then(function (data) {
        count.textContent = data.count || '—';
      })
      .catch(function () {
        card.classList.add('vc-visitors--offline');
      });
  })();
</script>
{% endif %}
