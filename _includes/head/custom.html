<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
<link rel="shortcut icon" href="images/favicon.ico">
<link rel="manifest" href="images/site.webmanifest">

<meta name="theme-color" content="#fcfcfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">

<!-- fonts (Exo is imported in main.scss) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- early theme bootstrap (before paint to avoid flash) -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem('vc-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>

<!-- link previews (WeChat, Slack, X, ...) -->
<meta name="description" content="{{ site.description | escape }}">
<meta property="og:type" content="website">
<meta property="og:image" content="{{ site.author.photos[0].src | absolute_url }}">
<meta property="og:image:alt" content="{{ site.author.photos[0].alt | escape }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ site.title | escape }}">
<meta name="twitter:description" content="{{ site.description | escape }}">
<meta name="twitter:image" content="{{ site.author.photos[0].src | absolute_url }}">

<!-- end custom head snippets -->
